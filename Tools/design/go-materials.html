<!doctype html><html><meta charset="utf-8"><style>
/* ============ brand tokens (brand-spec.md) ============ */
:root{
  --bg: oklch(0.975 0.004 95);
  --surface: oklch(1 0 0);
  --fg: oklch(0.27 0.015 80);
  --muted: oklch(0.56 0.015 80);
  --border: oklch(0.91 0.008 85);
  --accent: oklch(0.868 0.155 92.5);
  --accent-ink: oklch(0.30 0.03 85);
  --accent-deep: oklch(0.60 0.13 80);
  --font: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono: ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--font);color:var(--fg);
  background:
    radial-gradient(1200px 700px at 20% -10%, oklch(0.95 0.03 92) 0%, transparent 60%),
    radial-gradient(1000px 600px at 110% 110%, oklch(0.94 0.02 85) 0%, transparent 55%),
    oklch(0.935 0.008 90);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;gap:18px;padding:28px 12px;
}

/* ============ phone frame ============ */
.phone{
  position:relative;width:400px;height:min(812px, calc(100vh - 120px));min-height:640px;
  background:var(--bg);border-radius:44px;overflow:hidden;
  border:1px solid oklch(0.86 0.01 85);
  box-shadow:
    0 40px 80px -32px oklch(0.45 0.03 80 / .45),
    0 8px 24px -10px oklch(0.5 0.03 80 / .25);
  display:flex;flex-direction:column;
}
.page-caption{font-size:12.5px;color:oklch(0.52 0.02 85);letter-spacing:.02em;}
.page-caption a{color:var(--accent-deep);text-decoration:none;border-bottom:1px solid oklch(0.80 0.06 85);}
.page-caption b{color:var(--fg);font-weight:700;}

/* ============ top bar: scene toggle + counter ============ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 20px 4px;flex:none;
}
.scene-toggle{
  appearance:none;border:0;background:none;cursor:pointer;
  display:inline-flex;align-items:baseline;gap:7px;
  padding:8px 10px 8px 4px;border-radius:10px;
  font-family:var(--font);
}
.scene-toggle:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px;}
.scene-toggle:active .swap{transform:rotate(180deg);}
.swap{
  width:17px;height:17px;flex:none;align-self:center;color:var(--accent-deep);
  transition:transform .35s cubic-bezier(.3,.9,.3,1.2);
}
.scene-cur{font-size:16px;font-weight:800;color:var(--fg);letter-spacing:.02em;}
.scene-alt{font-size:11.5px;color:var(--muted);letter-spacing:.04em;transform:translateY(-1px);}
.counter{
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);
  padding-right:2px;
}
.counter b{color:var(--fg);font-weight:600;}

/* ============ cartridge stage ============ */
.stage{
  position:relative;flex:none;height:352px;margin-top:14px;
  touch-action:pan-y;user-select:none;cursor:grab;
}
.stage:active{cursor:grabbing;}
.track{
  position:absolute;left:50%;top:0;display:flex;gap:18px;
  will-change:transform;
}
.track.snapping{transition:transform .48s cubic-bezier(.22,.9,.24,1);}
.cart{flex:0 0 auto;width:236px;height:308px;padding-top:8px;opacity:.4;transform:scale(.92);filter:saturate(.55) brightness(1.03);transition:opacity .35s,transform .35s,filter .35s;}
.cart.active{opacity:1;transform:scale(1);filter:none;}
.cart-shell{
  position:relative;width:100%;height:300px;
  background:linear-gradient(180deg, oklch(0.965 0.006 90), oklch(0.925 0.007 85));
  clip-path:polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%);
  border-radius:12px 12px 10px 10px;
  box-shadow:
    inset 0 1.5px 0 oklch(1 0 0 / .9),
    0 18px 34px -20px oklch(0.5 0.04 80 / .5),
    0 3px 8px -4px oklch(0.5 0.04 80 / .25);
}
.cart-ridge{
  position:absolute;left:14px;right:14px;top:14px;height:16px;
  border-radius:6px 6px 0 0;
  background:linear-gradient(180deg, oklch(0.895 0.008 85), oklch(0.935 0.007 87));
  box-shadow:inset 0 1px 2px oklch(0.7 0.02 80 / .5), inset 0 -1px 0 oklch(1 0 0 / .7);
}
.cart-grooves{position:absolute;left:60px;right:60px;top:5px;height:9px;display:flex;justify-content:space-between;}
.cart-grooves i{width:5px;border-radius:3px;background:linear-gradient(180deg, oklch(0.88 0.008 85), oklch(0.94 0.006 88));box-shadow:inset 0 1px 1.5px oklch(0.68 0.02 80 / .45);}
.cart-label{
  position:absolute;left:22px;right:22px;top:52px;bottom:44px;
  border-radius:8px;border:6px solid oklch(0.995 0.002 90);
  box-shadow:0 1px 3px oklch(0.55 0.03 80 / .3), inset 0 0 0 1px oklch(0.3 0.02 80 / .08);
  overflow:hidden;display:flex;flex-direction:column;
}
.label-art{position:relative;flex:1;overflow:hidden;}
.label-strip{
  flex:none;height:30px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;gap:6px;padding:0 10px;
  font-size:10.5px;font-weight:800;letter-spacing:.14em;
}
.label-strip img{width:16px;height:16px;border-radius:50%;display:block;}
.label-strip span{margin-right:auto;}
.label-strip em{font-style:normal;font-family:var(--mono);font-weight:600;letter-spacing:.06em;font-size:9.5px;opacity:.75;}
.cart-foot{
  position:absolute;left:0;right:0;bottom:9px;text-align:center;
  font-size:8.5px;letter-spacing:.5em;color:oklch(0.78 0.012 85);font-weight:700;
  text-shadow:0 1px 0 oklch(1 0 0 / .8);padding-left:.5em;
}
.cart-foot::before{
  content:"";display:block;width:0;height:0;margin:0 auto 5px;
  border-left:5px solid transparent;border-right:5px solid transparent;
  border-top:6px solid oklch(0.82 0.012 85);
}

/* ---- label art: 2048 ---- */
.art-2048{background:#f7ecd6;display:flex;align-items:center;justify-content:center;}
.t2048{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px;background:#bbada0;border-radius:8px;}
.t2048 i{width:56px;height:56px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-style:normal;}
.t2048 .n2{background:#eee4da;color:#776e65;font-size:22px;}
.t2048 .n4{background:#ede0c8;color:#776e65;font-size:22px;}
.t2048 .n8{background:#f2b179;color:#f9f6f2;font-size:22px;}
.t2048 .n2048{background:#edc22e;color:#f9f6f2;font-size:17px;box-shadow:0 0 12px 2px #edc22e88;}

/* ---- label art: snake (Nokia 绿) ---- */
.art-snake{background:#9bbc0f;
  background-image:repeating-linear-gradient(0deg, transparent 0 9px, rgba(15,56,15,.08) 9px 10px),repeating-linear-gradient(90deg, transparent 0 9px, rgba(15,56,15,.08) 9px 10px);}
.snake-bit{position:absolute;width:20px;height:20px;background:#0f380f;border-radius:2px;}
.snake-apple{position:absolute;width:14px;height:14px;background:#0f380f;border-radius:50%;box-shadow:0 0 0 3px #9bbc0f;}

/* ---- label art: tetris ---- */
.art-tetris{background:#191c2b;}
.tet{position:absolute;display:grid;gap:2px;}
.tet i{width:17px;height:17px;border-radius:2.5px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.25);}
.tet-i{grid-template-columns:repeat(4,1fr);}.tet-i i{background:#31c7ef;}
.tet-o{grid-template-columns:repeat(2,1fr);}.tet-o i{background:#f7d308;}
.tet-t{grid-template-columns:repeat(3,1fr);}.tet-t i{background:#ad4d9c;}
.tet-l{grid-template-columns:repeat(3,1fr);}.tet-l i{background:#ef7d21;}
.tet-z{grid-template-columns:repeat(3,1fr);}.tet-z i{background:#ef2020;}
.tet-s{grid-template-columns:repeat(3,1fr);}.tet-s i{background:#42b642;}
.tet-j{grid-template-columns:repeat(3,1fr);}.tet-j i{background:#5a65f2;}
.tet .hole{visibility:hidden;}

/* ---- label art: breakout ---- */
.art-breakout{background:#14161f;}
.bricks{position:absolute;left:10px;right:10px;top:10px;display:grid;gap:5px;}
.brick-row{height:12px;border-radius:2px;}
.paddle{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:52px;height:9px;border-radius:5px;background:#f4f6ff;box-shadow:0 0 10px #f4f6ff66;}
.ball{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffd152;box-shadow:0 0 8px #ffd152aa;}

/* ---- label art: minesweeper ---- */
.art-mine{background:#c6c6c6;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:3px;padding:12px;}
.mine-cell{background:#e8e8e8;border-radius:2px;box-shadow:inset 1.5px 1.5px 0 #fff, inset -1.5px -1.5px 0 #8a8a8a;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;}
.mine-cell.open{background:#d6d6d6;box-shadow:inset 0 0 0 1px #a8a8a8;}
.mine-cell .c1{color:#3a5fcd;}.mine-cell .c2{color:#2e7d32;}.mine-cell .c3{color:#d32f2f;}
.mine-cell.flag{background:#e8e8e8;}
.mine-cell.flag::after{content:"";width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid #d32f2f;transform:translateY(-2px);}

/* ---- label art: jumper（本地练习项目） ---- */
.art-jumper{background:linear-gradient(180deg,#bfe6f5,#e8f6fd);}
.platform{position:absolute;height:9px;border-radius:5px;background:#5b7a8c;}
.jumper-ball{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--accent);box-shadow:inset -3px -4px 0 rgba(0,0,0,.12), 0 6px 10px -6px rgba(30,60,90,.5);}
.jumper-ball::before{content:"";position:absolute;left:6px;top:5px;width:6px;height:6px;border-radius:50%;background:#fff9;}

/* ============ info area ============ */
.info{padding:6px 26px 0;flex:1;min-height:0;display:flex;flex-direction:column;}
.info.swap-in .info-inner{animation:infoIn .45s cubic-bezier(.2,.8,.2,1) both;}
@keyframes infoIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.game-name{font-size:26px;font-weight:800;letter-spacing:.01em;line-height:1.2;}
.game-desc{margin-top:9px;font-size:13.5px;line-height:1.65;color:var(--muted);max-width:34em;}
.meta-row{margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.chip{
  font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--fg);
  border:1px solid var(--border);background:var(--surface);
  padding:5px 11px;border-radius:999px;
}
.chip.accent{border-color:oklch(0.82 0.10 88);background:oklch(0.95 0.05 92);color:var(--accent-deep);}
.author-row{
  margin-top:16px;padding-top:14px;border-top:1px dashed var(--border);
  display:flex;align-items:center;gap:10px;
}
.avatar{
  width:26px;height:26px;border-radius:50%;flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#fff;
  border:1px solid oklch(0.3 0.02 80 / .08);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.author-name{font-size:12.5px;font-weight:700;}
.author-role{font-size:11px;color:var(--muted);margin-top:1px;}

/* ============ gesture guide overlay ============ */
.guide{
  position:absolute;inset:0;z-index:30;
  background:oklch(0.25 0.02 80 / .55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .35s;
}
.guide.show{opacity:1;pointer-events:auto;}
.guide-card{
  width:300px;background:var(--surface);border-radius:22px;padding:26px 24px 20px;
  box-shadow:0 30px 60px -20px oklch(0.2 0.02 80 / .5);
  transform:translateY(16px) scale(.96);transition:transform .4s cubic-bezier(.2,.9,.25,1.15);
}
.guide.show .guide-card{transform:none;}
.guide-title{font-size:15px;font-weight:800;letter-spacing:.06em;text-align:center;}
.guide-sub{font-size:11px;color:var(--muted);text-align:center;margin-top:4px;letter-spacing:.04em;}
.g-row{display:flex;align-items:center;gap:16px;margin-top:20px;}
.g-anim{
  position:relative;flex:none;width:64px;height:64px;border-radius:16px;
  background:oklch(0.955 0.015 92);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.g-anim::before{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 2px 6px oklch(0.7 0.12 85 / .6);}
.anim-h::before{animation:slideH 1.6s cubic-bezier(.45,0,.55,1) infinite;}
@keyframes slideH{0%,100%{transform:translateX(-16px);}50%{transform:translateX(16px);}}
.anim-up::before{animation:slideUp 1.4s cubic-bezier(.3,0,.4,1) infinite;}
@keyframes slideUp{0%{transform:translateY(16px);opacity:0;}25%{opacity:1;}80%{transform:translateY(-16px);opacity:1;}100%{transform:translateY(-18px);opacity:0;}}
.anim-tap::before{animation:tapDot 1.6s ease-out infinite;}
@keyframes tapDot{0%,18%{transform:scale(.6);opacity:1;}30%,46%{transform:scale(.3);opacity:1;}58%,100%{transform:scale(.6);opacity:1;}}
.g-anim .ripple{position:absolute;width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ripple 1.6s ease-out infinite;}
.g-anim .ripple.r2{animation-delay:.28s;}
@keyframes ripple{0%,15%{transform:scale(.3);opacity:.9;}45%,100%{transform:scale(1);opacity:0;}}
.g-arrow{position:absolute;color:var(--accent-deep);font-size:0;}
.g-arrow svg{width:34px;height:34px;}
.anim-h .g-arrow svg{animation:fadeA 1.6s ease-in-out infinite;}
.anim-up .g-arrow svg{animation:fadeB 1.4s ease-in-out infinite;}
@keyframes fadeA{0%,100%{opacity:.25;}50%{opacity:.9;}}
@keyframes fadeB{0%,100%{opacity:.9;}40%,80%{opacity:.2;}}
.g-copy b{display:block;font-size:14px;font-weight:800;}
.g-copy small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;}
.guide-dismiss{
  margin-top:22px;text-align:center;font-size:11.5px;color:var(--muted);letter-spacing:.08em;
  animation:breath 2.2s ease-in-out infinite;
}
@keyframes breath{0%,100%{opacity:.45;}50%{opacity:1;}}

/* ============ play sheet & toast ============ */
.sheet-mask{
  position:absolute;inset:0;z-index:25;background:oklch(0.25 0.02 80 / .35);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.sheet-mask.show{opacity:1;pointer-events:auto;}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:26;
  background:var(--surface);border-radius:22px 22px 0 0;padding:22px 24px 30px;
  transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);
  box-shadow:0 -12px 40px -18px oklch(0.4 0.03 80 / .4);
}
.sheet.show{transform:none;}
.sheet-grab{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 18px;}
.sheet-title{font-size:15px;font-weight:800;}
.sheet-sub{font-size:12px;color:var(--muted);margin-top:5px;}
.progress{height:6px;border-radius:3px;background:oklch(0.94 0.012 90);margin-top:18px;overflow:hidden;}
.progress i{display:block;height:100%;width:0;border-radius:3px;background:var(--accent);transition:width .2s linear;}
.sheet-done{display:none;margin-top:18px;}
.sheet.done .sheet-done{display:flex;gap:10px;}
.sheet.done .progress{display:none;}
.btn-ghost{
  appearance:none;border:1px solid var(--border);background:var(--surface);cursor:pointer;
  font-family:var(--font);font-size:13px;font-weight:700;color:var(--fg);
  padding:10px 18px;border-radius:12px;
}
.btn-ghost:hover{background:oklch(0.96 0.008 90);}
.btn-ghost:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px;}
.toast{
  position:absolute;left:50%;bottom:34px;transform:translate(-50%,16px);z-index:40;
  background:oklch(0.30 0.02 80);color:oklch(0.97 0.005 90);
  font-size:12px;font-weight:600;letter-spacing:.03em;
  padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;white-space:nowrap;
  box-shadow:0 10px 24px -10px oklch(0.2 0.02 80 / .6);
}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media (max-height:820px){
  body{padding:14px 12px;gap:10px;}
  .phone{height:calc(100vh - 76px);}
}
/* Cartridge feed and insertion choreography. Shared by both preview states. */
.phone { width:min(400px,calc(100vw - 24px)); min-height:0; height:min(812px,calc(100dvh - 100px)); isolation:isolate; }
.topbar { position:relative; z-index:3; }
.stage { z-index:4; flex:1; min-height:0; height:auto; margin-top:0; overflow:hidden; touch-action:none; }
.stage:focus { outline:none; }
.stage:focus-visible { outline:2px solid oklch(.75 .12 88 / .55); outline-offset:-3px; }
.track { inset:0; display:block; width:100%; height:100%; gap:0; }
.track.snapping { transition:transform 320ms cubic-bezier(.22,1,.36,1); }
.feed-page { position:absolute; inset:0; display:flex; flex-direction:column; padding-bottom:72px; }
.cartridge-wrap { min-height:260px; flex:1; display:flex; align-items:center; justify-content:center; }
.cart { opacity:1; filter:none; transform:scale(var(--cart-scale,1)); transition:none; transform-origin:center; }
.cart.active { transform:scale(var(--cart-scale,1)); }
.info { flex:0 0 auto; padding:8px 26px 0; transition:opacity 160ms ease-out; }
.game-name { font-size:26px; }
.game-desc { min-height:44px; }
.meta-row:empty,.author-role:empty { display:none; }
.author-row { margin-top:14px; padding-top:12px; }
.meta-row:not(:empty) + .author-row { margin-top:10px; }
.feed-page[aria-hidden="true"] { pointer-events:none; }
.feed-page[aria-hidden="true"] .cart { opacity:1; filter:none; }
.phone[data-phase="dragging-left"] .feed-page.active .info { opacity:.45; }
.phone[data-phase="inserting"] .topbar,.phone[data-phase="inserting"] .info { opacity:0; transition:opacity 160ms ease-out; }
.phone[data-phase="inserting"] .stage,.phone[data-phase="loading"] .stage { pointer-events:none; }
.insertion-layer { position:absolute; inset:0; pointer-events:none; z-index:12; perspective:1000px; }
.launch-cart { position:absolute; width:236px; height:308px; margin:0; opacity:1; filter:none; will-change:transform; transform-origin:center; }
.console-slot { position:absolute; left:-30px; width:162px; height:280px; z-index:3; pointer-events:none; transform:translateX(-190px); opacity:0; }
.console-body { position:absolute; inset:0 18px 0 0; border-radius:20px 26px 26px 20px; background:linear-gradient(120deg,#f4f1e9,#dcd8cd 72%,#c4c0b6); border:1px solid #c7c2b7; box-shadow:inset 0 2px 1px #fff,8px 12px 28px -10px #554a3940; }
.console-vent { position:absolute; left:48px; top:34px; width:46px; height:29px; background:repeating-linear-gradient(0deg,#8b897d 0 2px,transparent 2px 7px); opacity:.45; }
.console-logo { position:absolute; left:45px; bottom:38px; font-size:9px; font-weight:800; color:#898479; letter-spacing:.26em; }
.console-light { position:absolute; left:48px; bottom:68px; width:5px; height:5px; border-radius:50%; background:#aba697; transition:background 120ms,box-shadow 120ms; }
.console-slot.engaged .console-light { background:#deb83f; box-shadow:0 0 12px #ffd152; }
.slot-mouth { position:absolute; right:16px; top:27px; width:23px; height:172px; border-radius:12px; background:linear-gradient(90deg,#383831,#131813 60%,#626053); box-shadow:inset 3px 0 5px #0009,1px 0 0 #fff8,-3px 0 0 #9c988b; }
.slot-mouth::after { content:""; position:absolute; top:10px; bottom:10px; right:4px; width:2px; background:#ffd152; opacity:.3; border-radius:2px; }
.console-slot.engaged .slot-mouth::after { opacity:.9; }
.sheet-mask { display:none; }
.sheet { inset:0; z-index:26; border-radius:0; padding:36px 32px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg); box-shadow:none; transform:none; opacity:0; visibility:hidden; pointer-events:none; transition:opacity 240ms ease-out,visibility 240ms; }
.sheet.show { opacity:1; visibility:visible; pointer-events:auto; }
.sheet-grab { display:none; }
.loading-mark { width:54px; height:54px; object-fit:contain; margin-bottom:28px; }
.loading-eyebrow { font-family:var(--mono); font-size:10px; letter-spacing:.2em; color:var(--muted); margin-bottom:12px; }
.sheet-title { font-size:23px; text-align:center; }
.sheet-sub { margin-top:12px; text-align:center; line-height:1.7; }
.progress { width:190px; height:4px; margin-top:28px; }
.progress i { width:100%; transform:scaleX(0); transform-origin:left; transition:transform 220ms linear; }
.sheet-done { display:flex; margin-top:30px; }
.sheet.done .progress { display:block; }
@media (max-height:760px) { .phone { height:calc(100dvh - 78px); } .cartridge-wrap { min-height:208px; } .cart {  } .info { flex-basis:auto; } .game-name { font-size:23px; } .game-desc { font-size:12.5px; } }
